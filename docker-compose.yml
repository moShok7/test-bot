services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: test-bot_app
    env_file:
      - .env
    volumes:
      - ./:/var/www
    depends_on:
      - mysql
    networks:
      - test-bot_network

  nginx:
    image: nginx:latest
    container_name: test-bot_nginx
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - test-bot_network

  mysql:
    image: mariadb:10.4
    container_name: test-bot_mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      MYSQL_DATABASE: test_bot
      MYSQL_USER: laravel
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3309:3306"
    volumes:
      - test-bot_mysql_data:/var/lib/mysql
    networks:
      - test-bot_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: test-bot_phpmyadmin
    restart: unless-stopped
    ports:
      - "8083:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql
    networks:
      - test-bot_network

  telegram_bot:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: test-bot_bot
    command: php artisan telegram:bot
    env_file:
      - .env
    volumes:
      - ./:/var/www
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - test-bot_network

  worker_telegram_1:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: test-bot_worker_telegram_1
    command: php artisan queue:work --queue=telegram --sleep=1 --tries=3 --timeout=120 --max-jobs=500
    env_file:
      - .env
    volumes:
      - ./:/var/www
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - test-bot_network

  worker_telegram_2:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: test-bot_worker_telegram_2
    command: php artisan queue:work --queue=telegram --sleep=1 --tries=3 --timeout=120 --max-jobs=500
    env_file:
      - .env
    volumes:
      - ./:/var/www
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - test-bot_network

  worker_telegram_3:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: test-bot_worker_telegram_3
    command: php artisan queue:work --queue=telegram --sleep=1 --tries=3 --timeout=120 --max-jobs=500
    env_file:
      - .env
    volumes:
      - ./:/var/www
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - test-bot_network

  worker_default:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: test-bot_worker_default
    command: php artisan queue:work --queue=default --sleep=1 --tries=3 --timeout=120 --max-jobs=500
    env_file:
      - .env
    volumes:
      - ./:/var/www
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - test-bot_network

networks:
  test-bot_network:
    name: test-bot_network
    enable_ipv6: false

volumes:
  test-bot_mysql_data:
    name: test-bot_mysql_data