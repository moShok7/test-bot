services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: test_bot_app
    env_file:
      - .env
    volumes:
      - ./:/var/www
    depends_on:
      - mysql
    networks:
      - test_bot_network

  nginx:
    image: nginx:latest
    container_name: test_bot_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - test_bot_network

  mysql:
    image: mariadb:10.4
    container_name: test_bot_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: test_bot
      MYSQL_USER: test_bot
      MYSQL_PASSWORD: test_password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3309:3306"
    volumes:
      - test_bot_mysql_data:/var/lib/mysql
    networks:
      - test_bot_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: test_bot_phpmyadmin
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql
    networks:
      - test_bot_network

  telegram_bot:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: test_bot_bot
    command: php artisan telegram:bot
    env_file:
      - .env
    volumes:
      - ./:/var/www
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - test_bot_network

  worker_telegram_1:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: test_bot_worker_telegram_1
    command: php artisan queue:work --queue=telegram --sleep=1 --tries=3 --timeout=120 --max-jobs=500
    env_file:
      - .env
    volumes:
      - ./:/var/www
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - test_bot_network

  worker_telegram_2:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: test_bot_worker_telegram_2
    command: php artisan queue:work --queue=telegram --sleep=1 --tries=3 --timeout=120 --max-jobs=500
    env_file:
      - .env
    volumes:
      - ./:/var/www
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - test_bot_network

  worker_telegram_3:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: test_bot_worker_telegram_3
    command: php artisan queue:work --queue=telegram --sleep=1 --tries=3 --timeout=120 --max-jobs=500
    env_file:
      - .env
    volumes:
      - ./:/var/www
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - test_bot_network

  worker_default:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: test_bot_worker_default
    command: php artisan queue:work --queue=default --sleep=1 --tries=3 --timeout=120 --max-jobs=500
    env_file:
      - .env
    volumes:
      - ./:/var/www
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - test_bot_network

networks:
  test_bot_network:
    enable_ipv6: false

volumes:
  test_bot_mysql_data:
    external: true