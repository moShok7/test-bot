services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sus_lobby_app
    volumes:
      - ./:/var/www
    depends_on:
      - mysql
    networks:
      - sus_lobby_network

  nginx:
    image: nginx:latest
    container_name: sus_lobby_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - sus_lobby_network

  mysql:
    image: mariadb:10.4
    container_name: sus_lobby_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sus_lobby
      MYSQL_USER: laravel
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - sus-lobby_mysql_data:/var/lib/mysql
    networks:
      - sus_lobby_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sus_lobby_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql
    networks:
      - sus_lobby_network

  telegram_bot:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sus_lobby_bot
    command: php artisan telegram:bot
    volumes:
      - ./:/var/www
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - sus_lobby_network

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sus_lobby_worker
    command: php artisan queue:work --queue=telegram --sleep=1 --tries=3 --timeout=120
    volumes:
      - ./:/var/www
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - sus_lobby_network

networks:
  sus_lobby_network:

volumes:
  sus-lobby_mysql_data:
    external: true