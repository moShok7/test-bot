services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sus_lobby_app
    env_file:
      - .env
    volumes:
      - ./:/var/www
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sus_lobby_network

  nginx:
    image: nginx:latest
    container_name: sus_lobby_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - sus_lobby_network

  mysql:
    image: mariadb:10.4
    container_name: sus_lobby_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sus_lobby
      MYSQL_USER: laravel
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3310:3306"
    volumes:
      - sus_lobby_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sus_lobby_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sus_lobby_phpmyadmin
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sus_lobby_network

  telegram_bot:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sus_lobby_bot
    command: php artisan telegram:bot
    env_file:
      - .env
    volumes:
      - ./:/var/www
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sus_lobby_network

  telegram_mute_listener:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sus_lobby_mute_listener
    command: php artisan telegram:mute-listener
    env_file:
      - .env
    volumes:
      - ./:/var/www
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sus_lobby_network

  worker_telegram_1:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sus_lobby_worker_telegram_1
    command: php artisan queue:work --queue=telegram --sleep=1 --tries=3 --timeout=120 --max-jobs=500
    env_file:
      - .env
    volumes:
      - ./:/var/www
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sus_lobby_network

  worker_telegram_2:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sus_lobby_worker_telegram_2
    command: php artisan queue:work --queue=telegram --sleep=1 --tries=3 --timeout=120 --max-jobs=500
    env_file:
      - .env
    volumes:
      - ./:/var/www
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sus_lobby_network

  worker_telegram_3:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sus_lobby_worker_telegram_3
    command: php artisan queue:work --queue=telegram --sleep=1 --tries=3 --timeout=120 --max-jobs=500
    env_file:
      - .env
    volumes:
      - ./:/var/www
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sus_lobby_network

  worker_default:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sus_lobby_worker_default
    command: php artisan queue:work --queue=default --sleep=1 --tries=3 --timeout=120 --max-jobs=500
    env_file:
      - .env
    volumes:
      - ./:/var/www
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sus_lobby_network

networks:
  sus_lobby_network:
    enable_ipv6: false

volumes:
  sus_lobby_mysql_data:
